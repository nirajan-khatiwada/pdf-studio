<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Studio — Document Page Management & Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-title">PDF Studio</span>
    </div>
    <div class="header-center">
      <span id="docTitleDisplay" class="doc-title-text">Workspace Document</span>
    </div>
  </header>
  <div class="app-body">
    <main class="workspace-scroll" id="workspaceScroll">
      <div class="page-grid" id="pageGrid"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
