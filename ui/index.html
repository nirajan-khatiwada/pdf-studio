<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Studio — Document Page Management & Editor</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <button id="btnToggleSidebar" class="btn btn-ghost btn-icon-sm" title="Toggle Explorer Sidebar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>

      <div class="brand">
        <!-- Minimal Geometric SVG Logo -->
        <svg class="brand-logo" width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="12" height="15" rx="1.5" stroke="#09090b" stroke-width="1.8" fill="#ffffff"/>
          <rect x="8" y="6" width="13" height="15" rx="1.5" stroke="#09090b" stroke-width="1.8" fill="#ffffff"/>
          <line x1="11.5" y1="10.5" x2="17.5" y2="10.5" stroke="#09090b" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="11.5" y1="13.5" x2="17.5" y2="13.5" stroke="#09090b" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="11.5" y1="16.5" x2="15" y2="16.5" stroke="#09090b" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="brand-title">PDF Studio</span>
      </div>
    </div>

    <div class="header-center">
      <span id="docTitleDisplay" class="doc-title-text">Workspace Document</span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="btnClearAll" class="btn btn-ghost btn-sm" title="Clear all pages from workspace">Clear Workspace</button>
    </div>
  </header>

  <!-- Desktop Toolbar -->
  <div class="toolbar">
    <div class="toolbar-group">
      <button id="btnOpenPdf" class="btn btn-outline btn-sm" title="Open one or more PDF files">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Open File
      </button>
      <input type="file" id="pdfFileInput" accept="application/pdf" multiple style="display: none;">

      <button id="btnAddBlankPage" class="btn btn-outline btn-sm" title="Insert blank page inheriting neighbor orientation">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Add Blank
      </button>

      <button id="btnAnnotatePage" class="btn btn-outline btn-sm" title="Add text or image to selected page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Add Text / Image
      </button>

      <button id="btnRotatePage" class="btn btn-outline btn-sm" title="Rotate selected page 90 degrees clockwise">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Rotate 90°
      </button>


    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <button id="btnUndo" class="btn btn-ghost btn-icon-sm" title="Undo (Ctrl+Z)" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button id="btnRedo" class="btn btn-ghost btn-icon-sm" title="Redo (Ctrl+Y)" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
      </button>

      <div class="toolbar-separator"></div>

      <button id="btnZoomOut" class="btn btn-ghost btn-icon-sm" title="Zoom Out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <span id="zoomLevelDisplay" class="zoom-display">100%</span>
      <button id="btnZoomIn" class="btn btn-ghost btn-icon-sm" title="Zoom In">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <button id="btnExportPdf" class="btn btn-default btn-sm" title="Export unified PDF">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export PDF
      </button>
    </div>
  </div>

  <!-- App Body: VS Code-Style Sidebar + Main Workspace -->
  <div class="app-body">

    <!-- VS Code Style Explorer Sidebar -->
  <div class="app-body">
    <main class="workspace-scroll" id="workspaceScroll">
      <div class="empty-state" id="emptyState">
        <h3>No pages loaded</h3>
      </div>
      <div class="page-grid" id="pageGrid" style="display: none;"></div>
    </main>
  </div>
  <footer class="status-bar">
    <span id="statusPageCount">0 pages</span>
  </footer>
  <div class="toast-container" id="toastContainer"></div>
  <script src="app.js"></script>
</body>
</html>
